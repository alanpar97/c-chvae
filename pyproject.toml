[project]
name = "cchvae"
version = "0.1.0"
description = "C-CHVAE: counterfactual explanations for tabular data via a conditional heterogeneous VAE (Pawelczyk et al. 2020)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=2.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cchvae"]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "ty>=0.0.29",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N812"]  # allow `import torch.nn.functional as F` (PyTorch convention)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]
"examples/*" = ["N802", "N803", "N806", "E402"]
